<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3D2A44">
    <title>Extrator de Comprovantes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <style>
        :root {
            --paper: #F5F0E6;
            --card: #FFFCF6;
            --tape: #F9F3E4;
            --ink: #2A231D;
            --ink-soft: #786C5E;
            --line: #E3D9C6;
            --accent: #5B3E63;
            --accent-deep: #3D2A44;
            --accent-soft: #F1E8ED;
            --stamp: #2F6B4F;
            --stamp-soft: #E3EEE7;
            --danger: #A8402F;
            --danger-soft: #F5E6E1;
            --warn: #7A5A00;
            --warn-soft: #FFF8E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 18px 60px;
        }
        .container {
            position: relative;
            background: var(--card);
            border-radius: 18px;
            padding: 28px 22px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 18px 40px -14px rgba(42,35,29,0.35), 0 2px 10px rgba(42,35,29,0.08);
            border: 1px solid rgba(42,35,29,0.07);
        }
        .container::before {
            content: "";
            position: absolute;
            top: -9px; left: 0; right: 0;
            height: 18px;
            background-image: radial-gradient(circle at center, var(--paper) 9px, transparent 9.6px);
            background-size: 26px 18px;
            background-repeat: repeat-x;
            background-position: 13px center;
            pointer-events: none;
        }

        /* ---- Navegação por abas ---- */
        .app-tabs {
            display: flex;
            gap: 4px;
            background: var(--accent-soft);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 22px;
        }
        .app-tab {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            color: var(--accent-deep);
            transition: background 0.2s, color 0.2s;
            line-height: 1.3;
        }
        .app-tab.active {
            background: var(--accent-deep);
            color: var(--tape);
            box-shadow: 0 4px 10px -4px rgba(61,42,68,0.55);
        }

        /* ---- Painel de contas ---- */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .contas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .contas-title {
            font-family: Georgia, serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
        }
        .btn-refresh {
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 11px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            color: var(--ink-soft);
            cursor: pointer;
        }
        .btn-refresh:active { background: var(--line); }

        .contas-loading {
            text-align: center;
            padding: 30px 0;
            color: var(--ink-soft);
            font-size: 13px;
        }
        .spinner-small {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2.5px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 8px;
        }

        .secao-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 16px 0 8px;
        }
        .secao-label:first-child { margin-top: 0; }


        .conta-card {
            border-left: 3px solid var(--plum);
            background: var(--card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .conta-detalhes {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 4px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .modal-body {
            padding: 16px 20px;
            max-height: 55vh;
            overflow-y: auto;
        }
        .conta-nome {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 3px;
        }
        .conta-detalhes {
            font-size: 11.5px;
            color: var(--ink-soft);
            line-height: 1.5;
        }
        .conta-valor {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-deep);
            margin-top: 6px;
        }
        .conta-venc {
            display: inline-block;
            background: var(--warn);
            color: #fff;
            border-radius: 5px;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .conta-venc.proxima {
            background: var(--accent);
        }

        .copy-bloco {
            margin-top: 16px;
            background: var(--tape);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
        }
        .copy-bloco-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }
        .copy-bloco textarea {
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 12.5px;
            color: var(--ink);
            line-height: 1.6;
            resize: none;
            outline: none;
            min-height: 70px;
        }
        .btn-copiar-card {
            margin-top: 8px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent-deep);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }
        .btn-copiar-card:active { background: var(--accent-soft); }
        .btn-copiar-contas {
            width: 100%;
            background: var(--stamp);
            color: var(--tape);
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-copiar-contas:active { opacity: 0.85; }

        .empty-state {
            text-align: center;
            padding: 28px 0;
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.6;
        }
        .empty-state span { font-size: 26px; display: block; margin-bottom: 8px; }

        /* ---- Aba extrator (igual ao original) ---- */
        .masthead { text-align: center; margin-bottom: 22px; }
        .eyebrow {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 6px;
        }
        h1 {
            font-family: Georgia, 'Palatino Linotype', serif;
            font-size: 23px; font-weight: 600;
            color: var(--ink); letter-spacing: -0.01em;
        }
        .form-group { margin-bottom: 18px; }
        .form-group + .form-group { border-top: 1px dashed var(--line); padding-top: 18px; }
        .kicker {
            display: block; margin-bottom: 10px;
            color: var(--ink-soft); font-weight: 600;
            font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        }
        .format-options {
            display: flex; gap: 4px;
            background: var(--accent-soft);
            padding: 4px; border-radius: 12px;
        }
        .format-btn {
            flex: 1; padding: 10px 8px; border: none;
            background: transparent; border-radius: 9px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            font-family: inherit; color: var(--accent-deep);
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .format-btn.active {
            background: var(--accent-deep); color: var(--tape);
            box-shadow: 0 4px 10px -4px rgba(61,42,68,0.55);
        }
        .file-input-label {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 20px 16px;
            border: 1.5px dashed var(--accent); border-radius: 12px;
            background: var(--accent-soft); cursor: pointer;
            color: var(--accent-deep); font-weight: 600; font-size: 14px;
        }
        .file-input-label svg { flex-shrink: 0; width: 22px; height: 22px; }
        .file-input-label:active { background: var(--accent); color: var(--tape); }
        #fileInput { display: none; }
        .file-list { margin-top: 12px; max-height: 150px; overflow-y: auto; }
        .file-item {
            background: var(--paper); padding: 9px 12px;
            border-radius: 8px; margin-bottom: 6px;
            font-size: 12.5px; border: 1px solid var(--line);
        }
        .file-item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .file-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .rename-input {
            width: 100%; margin-top: 7px; padding: 7px 10px;
            border: 1px solid var(--line); border-radius: 6px;
            font-size: 12px; font-family: inherit; background: var(--card);
        }
        .rename-input:focus { border-color: var(--accent); outline: none; }
        .remove-file {
            background: transparent; color: var(--danger);
            border: 1px solid var(--danger); border-radius: 6px;
            padding: 4px 9px; cursor: pointer; font-size: 11px; font-weight: 600;
        }
        button.process-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: var(--tape); border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700; font-family: inherit;
            cursor: pointer; margin-top: 4px;
            box-shadow: 0 10px 24px -10px rgba(61,42,68,0.6);
        }
        button.process-btn:disabled {
            background: var(--line); color: var(--ink-soft);
            cursor: not-allowed; box-shadow: none;
        }
        .output-section { margin-top: 22px; display: none; }
        .output-section.show { display: block; }
        .output-box {
            background: var(--tape); border: 1px solid var(--line);
            border-radius: 10px; padding: 14px; max-height: 200px;
            width: 100%; overflow-y: auto;
            font-family: ui-monospace, monospace; font-size: 12px;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
            color: var(--ink); resize: none; display: block; margin-bottom: 10px;
        }
        .copy-btn {
            display: flex; align-items: center; justify-content: center;
            background: var(--stamp); color: var(--tape); border: none;
            padding: 11px; border-radius: 10px; cursor: pointer;
            font-size: 13px; font-weight: 700; font-family: inherit; width: 100%;
        }
        .run { display: none; padding-top: 18px; }
        .run.show { display: block; }
        .run-top { display: flex; align-items: center; gap: 12px; }
        .run .spinner { width: 22px; height: 22px; border-width: 2.5px; margin: 0; flex: none; }
        .run-text { min-width: 0; }
        .run-title { font-size: 14px; font-weight: 700; color: var(--ink); }
        .run-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
        .detalhes { display: none; margin-top: 14px; font-size: 12px; color: var(--ink-soft); }
        .detalhes.show { display: block; }
        .detalhes summary { cursor: pointer; list-style: none; font-weight: 600; padding: 6px 0; user-select: none; }
        .detalhes summary::-webkit-details-marker { display: none; }
        .detalhes summary::before { content: '▸ '; }
        .detalhes[open] summary::before { content: '▾ '; }
        .log-lines { max-height: 180px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 8px; }
        .log-row { display: flex; gap: 10px; padding: 2px 0; line-height: 1.45; }
        .log-t { color: #A99C8A; flex: none; font-variant-numeric: tabular-nums; }
        .btn-mini { margin-top: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); border-radius: 8px; }
        .progress-track {
            width: 100%; height: 6px; background: var(--line);
            border-radius: 3px; margin-top: 12px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--stamp) 100%);
            border-radius: 3px; transition: width 0.35s ease;
        }
        .progress-percent { font-size: 11px; color: var(--ink-soft); margin-top: 6px; text-align: right; }
        .spinner {
            border: 3px solid var(--line); border-top: 3px solid var(--accent);
            border-radius: 50%; width: 28px; height: 28px;
            animation: spin 0.9s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message, .success-message {
            padding: 11px 13px; border-radius: 8px; margin-top: 12px;
            display: none; font-size: 13px; font-weight: 600; line-height: 1.5;
        }
        .error-message { background: var(--danger-soft); color: var(--danger); border-left: 3px solid var(--danger); }
        .success-message { background: var(--stamp-soft); color: var(--stamp); border-left: 3px solid var(--stamp); }
        .error-message.show, .success-message.show { display: block; }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
    </style>
</head>
<body>
<div class="container">

    <!-- Navegação -->
    <div class="app-tabs">
        <button class="app-tab" data-tab="contas">📋 Contas do Dia</button>
        <button class="app-tab active" data-tab="extrator">📎 Extrator</button>
    </div>

    <!-- ============ ABA: CONTAS DO DIA ============ -->
    <div class="tab-panel" id="tab-contas">
        <div class="contas-header">
            <span class="contas-title">Contas a Pagar</span>
            <button class="btn-refresh" id="btnRefresh">↻ Atualizar</button>
        </div>
        <div id="contasBody">
            <div class="contas-loading">
                <div class="spinner-small"></div><br>Carregando contas...
            </div>
        </div>
    </div>

    <!-- ============ ABA: EXTRATOR ============ -->
    <div class="tab-panel active" id="tab-extrator">
        <div class="masthead">
            <p class="eyebrow">PIX · Boleto · TED</p>
            <h1>Extrator de Comprovantes</h1>
        </div>

        <div class="form-group">
            <p class="kicker">Formato de saída</p>
            <div class="format-options">
                <button class="format-btn active" data-format="contas">Contas a Pagar</button>
                <button class="format-btn" data-format="gastos">Gastos Pessoais</button>
            </div>
        </div>

        <div class="form-group">
            <label for="fileInput" class="kicker">Comprovantes</label>
            <div>
                <label for="fileInput" class="file-input-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 15.5h6M9 9h3"/></svg>
                    <span>Toque ou arraste os comprovantes aqui</span>
                </label>
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <button class="process-btn" id="processBtn" disabled>Processar e Salvar na Planilha</button>

        <div class="run" id="loading">
            <div class="run-top">
                <div class="spinner"></div>
                <div class="run-text">
                    <div class="run-title" id="loadingStatus">Preparando...</div>
                    <div class="run-sub" id="loadingSub"></div>
                </div>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-percent" id="progressPercent"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <details class="detalhes" id="detalhes">
            <summary>Detalhes técnicos</summary>
            <div class="log-lines" id="logEnvio"></div>
            <button type="button" class="btn-mini" id="btnCopiarLog">Copiar detalhes</button>
        </details>

        <div class="output-section" id="outputSection">
            <p class="kicker">Resultado salvo na planilha</p>
            <textarea class="output-box" id="outputBox" readonly></textarea>
            <button class="copy-btn" id="copyBtn">📋 Copiar Resultado</button>
            <button class="copy-btn" id="btnLimpar" style="margin-top:8px;background:var(--ink-soft)">🗑️ Limpar e enviar novos</button>
        </div>
    </div>

</div>
<script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxoNXwFSZf4LyiF6hltAM5c2R6KmZzfwmEo6iZNGIVyaHbIKhFzQaT27uXGj-192DjW/exec";
    const SHARED_SECRET = "2667";

    // ---- Navegação por abas ----
    document.querySelectorAll('.app-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        });
    });

    // ================================================================
    // ABA CONTAS DO DIA
    // ================================================================
    function formatarDataBR(d) {
        return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
    }

    async function carregarContas() {
        const body = document.getElementById('contasBody');
        const MAX = 3;
        for (let t = 1; t <= MAX; t++) {
            body.innerHTML = `<div class="contas-loading"><div class="spinner-small"></div><br>Carregando...${t > 1 ? ` (tentativa ${t} de ${MAX})` : ''}</div>`;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 45000);
            try {
                const res = await fetch(BACKEND_URL + '?secret=' + encodeURIComponent(SHARED_SECRET), { signal: ctrl.signal });
                const data = await lerRespostaJSON(res);
                if (data.error) throw new Error(data.error); // erro "de verdade": mostra direto
                renderContas(data.contas || []);
                return;
            } catch (e) {
                const transitorio = !!(e.tipo || e.name === 'AbortError' || e instanceof TypeError);
                if (transitorio && t < MAX) { await sleep(2500); continue; }
                let msg = e.message;
                if (e.tipo === 'invalida') msg = 'O Google devolveu uma página de erro em vez das contas' + (e.detalhe ? ` (${e.detalhe})` : '') + '.';
                else if (e.tipo === 'timeout' || e.name === 'AbortError') msg = 'O servidor demorou demais para responder.';
                else if (e.tipo === 'rede' || e instanceof TypeError) msg = 'Sem conexão com o servidor.';
                body.innerHTML = `<div class="error-message show">❌ ${escaparHtml(msg)}<br><button type="button" class="btn-mini" onclick="carregarContas()">Tentar de novo</button></div>`;
                return;
            } finally {
                clearTimeout(timer);
            }
        }
    }

    function renderContas(contas) {
        const body = document.getElementById('contasBody');
        if (contas.length === 0) {
            body.innerHTML = '<div class="empty-state"><span>✅</span>Nenhuma conta em aberto<br>nos próximos 3 dias!</div>';
            return;
        }

        const atrasadas = contas.filter(c => c.grupo === 'atrasada');
        const hoje      = contas.filter(c => c.grupo === 'hoje');
        const proximas  = contas.filter(c => c.grupo === 'proxima');

        function formatarValor(v) {
            // Converte "99.9" ou "99,90" ou "1234.56" pra "R$ 99,90"
            if (!v) return '';
            const num = parseFloat(String(v).replace(',', '.'));
            if (isNaN(num)) return v;
            return 'R$ ' + num.toFixed(2).replace('.', ',');
        }

        function textoUnica(c) {
            const fornecedor = (c.fornecedor || c.nome || '').trim();
            const partes = [
                c.formaPag  ? c.formaPag  : null,
                c.vencimento ? 'Vencimento ' + c.vencimento : null,
                c.categoria  ? c.categoria  : null,
                c.valor      ? formatarValor(c.valor) : null,
            ].filter(Boolean).join('\n');
            const obs = (c.obs || '').trim(); // código de barras / PIX — vem por último

            return [fornecedor, partes, obs].filter(Boolean).join('\n\n');
        }

        function textoTodas(lista) {
            return lista.map((c, i) => lista.length > 1 ? `${i+1} ${textoUnica(c)}` : textoUnica(c)).join('\n\n');
        }

        function copiarTexto(txt, btn, label) {
            const exec = () => {
                btn.textContent = '✅ Copiado!';
                setTimeout(() => { btn.textContent = label; }, 2000);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(txt).then(exec).catch(() => { exec(); });
            } else { exec(); }
        }

        // Cartão com botão individual embutido
        function cartao(c, cor, idx) {
            const badge = cor === 'danger'
                ? `<span class="conta-venc" style="background:#A8402F">⚠️ Atrasada — ${c.vencimento}</span>`
                : cor === 'hoje'
                ? `<span class="conta-venc">Hoje — ${c.vencimento}</span>`
                : `<span class="conta-venc proxima">${c.vencimento}</span>`;
            const estilo = cor === 'danger' ? 'border-color:#A8402F;background:#F5E6E1' : '';
            const idCopiar = `btnCard_${cor}_${idx}`;
            const idPago = `btnPago_${cor}_${idx}`;
            return `
            <div class="conta-card ${cor === 'hoje' ? 'hoje' : ''}" style="${estilo}">
                ${badge}
                <div class="conta-nome">${c.nome || c.fornecedor}</div>

    }

    // ===== Envio de comprovantes =====

    // ---------- Conversa com o servidor ----------
    function escaparHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Quando o Google devolve uma página de erro (HTML) em vez de dados, mostra o que ela diz
    function resumirHtml(txt, status) {
        const titulo = ((txt.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || '').trim();
        const limpo = txt.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ')
                         .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        return ['HTTP ' + status, titulo, limpo.slice(0, 140)].filter(Boolean).join(' · ');
    }

    // Lê a resposta; erros de comunicação voltam com e.tipo = 'timeout' | 'rede' | 'invalida'
    async function lerRespostaJSON(res) {
        const erro = (tipo, detalhe) => { const e = new Error(tipo); e.tipo = tipo; e.detalhe = detalhe; return e; };
        let txt;
        try { txt = await res.text(); }
        catch (e) { throw erro(e.name === 'AbortError' ? 'timeout' : 'rede'); }
        try { return JSON.parse(txt); }
        catch (e) { throw erro('invalida', resumirHtml(txt, res.status)); }
    }

    async function chamarBackend(payload, timeoutMs) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            let res;
            try {
                res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
            } catch (e) {
                const err = new Error(e.name === 'AbortError' ? 'timeout' : 'rede');
                err.tipo = err.message;
                throw err;
            }
            return await lerRespostaJSON(res);
        } finally {
            clearTimeout(timer);
        }
    }

    async function verificarServidor() {
        // Se esta versão do servidor foi conferida há pouco, não perde tempo conferindo de novo
        try {
            const raw = localStorage.getItem('servidorOk');
            if (raw) {
                const s = JSON.parse(raw);
                if (s.versao === VERSAO_BACKEND_ESPERADA && Date.now() - s.ts < 6 * 60 * 60 * 1000) {
                    return { ok: true, modelos: s.modelos, cache: true };
                }
            }
        } catch (e) {}

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        try {
            const res = await fetch(BACKEND_URL + '?action=ping&secret=' + encodeURIComponent(SHARED_SECRET), { signal: ctrl.signal });
            const data = await lerRespostaJSON(res);
            if (data.error) return { ok: false, motivo: data.error };
            if (data.versao !== VERSAO_BACKEND_ESPERADA) return { desatualizado: true, versao: data.versao };
            try { localStorage.setItem('servidorOk', JSON.stringify({ versao: data.versao, modelos: data.modelos, ts: Date.now() })); } catch (e) {}
            return { ok: true, modelos: data.modelos };
        } catch (e) {
            const motivo = e.tipo === 'invalida' ? `o Google devolveu uma página de erro (${e.detalhe})`
                         : (e.name === 'AbortError' || e.tipo === 'timeout') ? 'sem resposta em 15s'
                         : 'sem conexão';
            return { ok: false, motivo };
        } finally {
            clearTimeout(timer);
        }
    }

    // ---------- Modelos: o que funcionou por último vai primeiro (por 30 min) ----------
    function ordenarModelos(lista) {
        try {
            const raw = localStorage.getItem('ultimoModeloOk');
            if (!raw) return lista;
            const { nome, ts } = JSON.parse(raw);
            if (Date.now() - ts > 30 * 60 * 1000) return lista;
            const i = lista.findIndex(m => m.nome === nome);
            if (i <= 0) return lista;
            return [lista[i]].concat(lista.filter((_, j) => j !== i));
        } catch (e) { return lista; }
    }
    function lembrarModelo(nome) {
        try { localStorage.setItem('ultimoModeloOk', JSON.stringify({ nome, ts: Date.now() })); } catch (e) {}
    }

    function descreverFalha(d) {
        if (d.detalhe && /fora do formato|vazia/i.test(d.detalhe)) return d.detalhe;
        if (d.status === 429) return 'limite de uso atingido';
        if (d.status === 404) return 'modelo indisponível';
        if ([500, 502, 503, 504].includes(d.status)) return `Google sobrecarregado (erro ${d.status})`;
        return `erro ${d.status}${d.detalhe ? ': ' + d.detalhe : ''}`;
    }

    // PASSO 1: ler o comprovante (tenta um modelo por vez; não grava nada)
    async function extrairComFallback(entry, base64, mimeType, posicao, total, modelos) {
        let redeSeguidas = 0;
        for (let m = 0; m < modelos.length; m++) {
            const { nome, tentativas } = modelos[m];
            const proximo = modelos[m + 1] ? bonito(modelos[m + 1].nome) : null;

            for (let t = 1; t <= tentativas; t++) {
                setStatus(`Arquivo ${posicao} de ${total}`, `Lendo com ${bonito(nome)} · tentativa ${t} de ${tentativas}`);
                addLog(`${bonito(nome)}: tentativa ${t}/${tentativas}`);

                const ini = Date.now();
                let data;
                try {
                    data = await chamarBackend({
                        action: 'extrair',
                        fileBase64: base64,
                        mimeType,
                        format: selectedFormat,
                        fileName: entry.file.name,
                        customName: entry.customName,
                        modelo: nome,
                        secret: SHARED_SECRET
                    }, TIMEOUT_EXTRAIR_MS);
                    redeSeguidas = 0;
                } catch (e) {
                    const seg = Math.round((Date.now() - ini) / 1000);
                    if (e.tipo === 'rede') {
                        redeSeguidas++;
                        addLog(`Sem conexão com o servidor (${seg}s)`);
                        if (redeSeguidas >= 3) {
                            throw new Error('Sem conexão com o servidor do Google. Confira a internet (Wi-Fi ou dados) e tente de novo.');
                        }
                    } else if (e.tipo === 'timeout') {
                        addLog(`${bonito(nome)}: sem resposta em ${seg}s`);
                    } else {
                        addLog('Resposta inválida do servidor' + (e.detalhe ? ': ' + e.detalhe : ''));
                    }
                    if (t < tentativas) {
                        setStatus(`Arquivo ${posicao} de ${total}`, 'Servidor ocupado — nova tentativa em instantes');
                        await sleep(ESPERA_ENTRE_TENTATIVAS_MS);
                        continue;
                    }
                    if (proximo) addLog(`Passando para ${proximo}`);
                    break;
                }

                const seg = ((Date.now() - ini) / 1000).toFixed(1);

                if (!data.error) {
                    addLog(`${bonito(data.modelo || nome)}: leu em ${seg}s` + (data.ms ? ` (no servidor: ${(data.ms / 1000).toFixed(1)}s)` : ''));
                    lembrarModelo(nome);
                    return data;
                }

                if (data.error === 'MODEL_FAIL') {
                    addLog(`${bonito(nome)}: ${descreverFalha(data)} (${seg}s)`);
                    if (data.retry === 'temp' && t < tentativas) {
                        setStatus(`Arquivo ${posicao} de ${total}`, `${bonito(nome)} ocupado — tentando de novo em ${ESPERA_ENTRE_TENTATIVAS_MS / 1000}s`);
                        await sleep(ESPERA_ENTRE_TENTATIVAS_MS);
                        continue;
                    }
                    if (proximo) addLog(`Passando para ${proximo}`);
                    break;
                }

                // Qualquer outro erro (senha, planilha...) não adianta repetir
                addLog(`Erro: ${data.error}`);
                throw new Error(data.error);
            }
        }
        throw new Error('Nenhum modelo da Gemini conseguiu ler este arquivo agora (todos sobrecarregados ou no limite). Tente de novo em alguns minutos.');
    }

    // PASSO 2: gravar na planilha. Pode repetir à vontade: o servidor não duplica.
    async function salvarLinha(requestId, row) {
        const MAX = 3;
        for (let r = 1; r <= MAX; r++) {
            try {
                const data = await chamarBackend({
                    action: 'salvar',
                    format: selectedFormat,
                    row,
                    requestId,
                    secret: SHARED_SECRET
                }, TIMEOUT_SALVAR_MS);
                if (data.error === 'SERVIDOR_OCUPADO') {
                    addLog('Planilha ocupada, tentando de novo');
                    await sleep(3000);
                    continue;
                }
                if (data.error) throw new Error(data.error);
                return data;
            } catch (e) {
                if (!e.tipo) throw e; // erro "de verdade" do servidor: não repete
                if (r >= MAX) {
                    throw new Error('Li o comprovante, mas não consegui confirmar a gravação na planilha. Confira a planilha; se não estiver lá, toque em Processar de novo (não duplica).');
                }
                addLog(`Falha ao gravar (${e.tipo}${e.detalhe ? ': ' + e.detalhe : ''}), tentando de novo ${r}/${MAX - 1}`);
                await sleep(3000);
            }
        }
    }

    function novoId() {
        try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    async function enviarArquivo(entry, posicao, total, modelos) {
        if (!entry.requestId) entry.requestId = novoId();
        const idDaGravacao = entry.requestId + '_' + selectedFormat;

        addLog(`Arquivo ${posicao}/${total}: ${entry.file.name}`);

        // Se a leitura já foi feita numa tentativa anterior, não precisa ler de novo
        let extraido = (entry.extraido && entry.extraidoFormato === selectedFormat) ? entry.extraido : null;
        if (extraido) {
            addLog('Leitura já feita antes; falta só gravar');
        } else {
            const { base64, mimeType } = await fileToBase64(entry.file);
            extraido = await extrairComFallback(entry, base64, mimeType, posicao, total, modelos);
            entry.extraido = extraido;
            entry.extraidoFormato = selectedFormat;
        }

        setStatus(`Arquivo ${posicao} de ${total}`, 'Gravando na planilha...');
        const salvo = await salvarLinha(idDaGravacao, extraido.row);
        addLog(salvo.duplicado ? 'Já estava gravado (não duplicou)' : `Gravado na linha ${salvo.linha}` + (salvo.ms ? ` (no servidor: ${(salvo.ms / 1000).toFixed(1)}s)` : ''));
        return { modelo: extraido.modelo, linha: salvo.linha };
    }

    async function processFiles() {
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const outputSection = document.getElementById('outputSection');
        const processBtn = document.getElementById('processBtn');

        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');
        outputSection.classList.remove('show');
        limparLog();
        loading.classList.add('show');
        processBtn.disabled = true;
        processando = true;
        await ligarTela();

        try {
            const totalInicial = selectedFiles.length;
            let processados = 0;
            const usados = [];
            setProgress(0, totalInicial);

            setStatus('Verificando conexão', 'Conferindo o servidor...');
            addLog('Conferindo o servidor');
            const srv = await verificarServidor();
            if (srv.desatualizado) {
                addLog(`Servidor na versão "${srv.versao || 'antiga'}"; esperado "${VERSAO_BACKEND_ESPERADA}"`);
                throw new Error('O servidor (Apps Script) ainda está na versão antiga. Cole o Code.gs novo e faça: Implantar → Gerenciar implantações → lápis → Nova versão → Implantar.');
            }
            let modeloBase = MODELOS_PADRAO;
            if (srv.ok) {
                addLog(srv.cache ? 'Servidor conferido há pouco' : 'Servidor ok');
                if (srv.modelos && srv.modelos.length) modeloBase = srv.modelos;
            } else {
                addLog(`Não consegui conferir o servidor (${srv.motivo}); seguindo assim mesmo`);
            }

            while (selectedFiles.length > 0) {
                const entry = selectedFiles[0]; // sempre o primeiro que sobrou
                setProgress(processados, totalInicial);

                const r = await enviarArquivo(entry, processados + 1, totalInicial, ordenarModelos(modeloBase));

                // Gravou: sai da lista na hora (se algo falhar depois, não reenvia este)
                selectedFiles.shift();
                updateFileList();
                processados++;
                usados.push(bonito(r.modelo));
                setProgress(processados, totalInicial);

                if (selectedFiles.length > 0) await sleep(1000);
            }

            loading.classList.remove('show');
            const unicos = Array.from(new Set(usados)).join(', ');
            successMessage.textContent = `✅ ${totalInicial} arquivo(s) salvo(s) na planilha! (${unicos})`;
            successMessage.classList.add('show');
            updateFileList();

        } catch (error) {
            addLog(`Parou: ${error.message}`);
            loading.classList.remove('show');
            errorMessage.textContent = '❌ ' + error.message + (selectedFiles.length ? ' · O que já foi gravado saiu da lista: é só tocar em Processar de novo para continuar.' : '');
            errorMessage.classList.add('show');
            processBtn.disabled = selectedFiles.length === 0;
        } finally {
            processando = false;
            soltarTela();
        }
    }

    processBtn.addEventListener('click', processFiles);

    // Botão limpar resultado
    document.getElementById('btnLimpar').addEventListener('click', () => {
        document.getElementById('outputSection').classList.remove('show');
        document.getElementById('successMessage').classList.remove('show');
        document.getElementById('errorMessage').classList.remove('show');
        document.getElementById('outputBox').value = '';
        setProgress(0);
        limparLog();
    });

    const copyBtn = document.getElementById('copyBtn');
    const outputBox = document.getElementById('outputBox');
    copyBtn.addEventListener('click', () => {
        const text = outputBox.value;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => { outputBox.select(); document.execCommand('copy'); });
        } else { outputBox.select(); document.execCommand('copy'); }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
</script>
</body>
</html>
