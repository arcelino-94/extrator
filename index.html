<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3D2A44">
    <title>Extrator de Comprovantes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        :root {
            --paper: #F5F0E6;
            --card: #FFFCF6;
            --tape: #F9F3E4;
            --ink: #2A231D;
            --ink-soft: #786C5E;
            --line: #E3D9C6;
            --accent: #5B3E63;
            --accent-deep: #3D2A44;
            --accent-soft: #F1E8ED;
            --stamp: #2F6B4F;
            --stamp-soft: #E3EEE7;
            --danger: #A8402F;
            --danger-soft: #F5E6E1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 18px 60px;
        }

        .container {
            position: relative;
            background: var(--card);
            border-radius: 18px;
            padding: 40px 26px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 18px 40px -14px rgba(42,35,29,0.35), 0 2px 10px rgba(42,35,29,0.08);
            border: 1px solid rgba(42,35,29,0.07);
        }

        .container::before {
            content: "";
            position: absolute;
            top: -9px;
            left: 0;
            right: 0;
            height: 18px;
            background-image: radial-gradient(circle at center, var(--paper) 9px, transparent 9.6px);
            background-size: 26px 18px;
            background-repeat: repeat-x;
            background-position: 13px center;
            pointer-events: none;
        }

        .masthead {
            text-align: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        h1 {
            font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
            font-size: 26px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group + .form-group {
            border-top: 1px dashed var(--line);
            padding-top: 20px;
        }

        .kicker {
            display: block;
            margin-bottom: 10px;
            color: var(--ink-soft);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .format-options {
            display: flex;
            gap: 4px;
            background: var(--accent-soft);
            padding: 4px;
            border-radius: 12px;
        }

        .format-btn {
            flex: 1;
            padding: 11px 8px;
            border: none;
            background: transparent;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            color: var(--accent-deep);
        }

        .format-btn.active {
            background: var(--accent-deep);
            color: var(--tape);
            box-shadow: 0 4px 10px -4px rgba(61,42,68,0.55);
        }

        .file-input-wrapper {
            position: relative;
            display: block;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 22px 16px;
            border: 1.5px dashed var(--accent);
            border-radius: 12px;
            background: var(--accent-soft);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            color: var(--accent-deep);
            font-weight: 600;
            font-size: 14px;
            text-align: center;
        }

        .file-input-label svg {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
        }

        .file-input-label:active {
            background: var(--accent);
            color: var(--tape);
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            background: var(--paper);
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 12.5px;
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .file-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .file-item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .rename-input {
            width: 100%;
            margin-top: 7px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            color: var(--ink);
            background: var(--card);
        }

        .rename-input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .rename-input::placeholder {
            color: var(--ink-soft);
            opacity: 0.75;
        }

        .remove-file {
            flex-shrink: 0;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 4px 9px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
        }

        .remove-file:active {
            background: var(--danger);
            color: var(--tape);
        }

        button.process-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: var(--tape);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 4px;
            box-shadow: 0 10px 24px -10px rgba(61,42,68,0.6);
        }

        button.process-btn:active:not(:disabled) {
            transform: translateY(1px) scale(0.99);
        }

        button.process-btn:disabled {
            background: var(--line);
            color: var(--ink-soft);
            cursor: not-allowed;
            box-shadow: none;
        }

        .output-section {
            margin-top: 26px;
            display: none;
        }

        .output-section.show {
            display: block;
        }

        .tape-wrap {
            margin-bottom: 6px;
        }

        .output-box {
            background: var(--tape);
            border: 1px solid var(--line);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            padding: 16px;
            max-height: 280px;
            min-height: 130px;
            width: 100%;
            overflow-y: auto;
            font-family: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--ink);
            resize: vertical;
            display: block;
        }

        .tape-tear {
            height: 11px;
            background-image:
                linear-gradient(135deg, var(--tape) 25%, transparent 25.5%),
                linear-gradient(225deg, var(--tape) 25%, transparent 25.5%);
            background-size: 14px 14px;
            background-repeat: repeat-x;
            background-position: top left;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--stamp);
            color: var(--tape);
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 700;
            font-family: inherit;
            transition: transform 0.15s ease, opacity 0.15s ease;
            width: 100%;
            margin-top: 14px;
        }

        .copy-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .copy-hint {
            font-size: 11.5px;
            color: var(--ink-soft);
            margin-top: 10px;
            text-align: center;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 22px 0 6px;
        }

        .loading.show {
            display: block;
        }

        .loading p {
            font-size: 13px;
            color: var(--ink-soft);
            margin-top: 10px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--line);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--stamp) 100%);
            border-radius: 3px;
            transition: width 0.35s ease;
        }

        .progress-percent {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 6px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .spinner {
            border: 3px solid var(--line);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message, .success-message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 14px;
            display: none;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
        }

        .error-message {
            background: var(--danger-soft);
            color: var(--danger);
            border-left: 3px solid var(--danger);
        }

        .success-message {
            background: var(--stamp-soft);
            color: var(--stamp);
            border-left: 3px solid var(--stamp);
        }

        .error-message.show, .success-message.show {
            display: block;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="masthead">
            <p class="eyebrow">PIX · Boleto · TED</p>
            <h1>Extrator de Comprovantes</h1>
        </div>

        <div class="form-group">
            <p class="kicker">Formato de saída</p>
            <div class="format-options">
                <button class="format-btn active" data-format="contas">Contas a Pagar</button>
                <button class="format-btn" data-format="gastos">Gastos Pessoais</button>
            </div>
        </div>

        <div class="form-group">
            <label for="fileInput" class="kicker">Comprovantes</label>
            <div class="file-input-wrapper">
                <label for="fileInput" class="file-input-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 15.5h6M9 9h3"/></svg>
                    <span>Toque ou arraste os comprovantes aqui</span>
                </label>
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <button class="process-btn" id="processBtn" disabled>Processar e Salvar na Planilha</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingStatus">Processando...</p>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-percent" id="progressPercent">0%</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="output-section" id="outputSection">
            <p class="kicker">Resultado salvo na planilha</p>
            <div class="tape-wrap">
                <textarea class="output-box" id="outputBox" readonly></textarea>
                <div class="tape-tear"></div>
            </div>
            <button class="copy-btn" id="copyBtn">📋 Copiar Resultado</button>
            <p class="copy-hint">Os dados já foram gravados direto na sua planilha. Copiar aqui é só um extra, caso precise.</p>
        </div>
    </div>

    <script>
        // ================================================================
        // CONFIGURAÇÃO — preencha com a URL do seu Apps Script e a senha
        // (o SHARED_SECRET) que você definiu nas Propriedades do Script.
        // ================================================================
        const BACKEND_URL = "COLE_AQUI_A_URL_DO_SEU_APPS_SCRIPT";
        const SHARED_SECRET = "COLE_AQUI_A_MESMA_SENHA_DO_SCRIPT_PROPERTIES";

        let selectedFormat = 'contas';
        let selectedFiles = [];

        // Format buttons
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedFormat = btn.dataset.format;
            });
        });

        // File input
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const processBtn = document.getElementById('processBtn');

        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
            fileInput.value = '';
        });

        // Drag and drop
        const container = document.querySelector('.container');
        container.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        container.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            addFiles(e.dataTransfer.files);
        });

        function addFiles(files) {
            Array.from(files).forEach(file => {
                if (!selectedFiles.find(f => f.file.name === file.name && f.file.size === file.size)) {
                    selectedFiles.push({ file: file, customName: '' });
                }
            });
            updateFileList();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function updateCustomName(index, value) {
            if (selectedFiles[index]) {
                selectedFiles[index].customName = value;
            }
        }

        function escapeAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-item-row">
                        <span class="file-item-name">${escapeAttr(entry.file.name)}</span>
                        <button class="remove-file" onclick="removeFile(${index})">Remover</button>
                    </div>
                    <input type="text" class="rename-input" placeholder="Descrição opcional (ex: Mercadinho)" value="${escapeAttr(entry.customName)}" oninput="updateCustomName(${index}, this.value)">
                `;
                fileList.appendChild(item);
            });
            processBtn.disabled = selectedFiles.length === 0;
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    const mimeType = file.type || 'application/octet-stream';
                    resolve({ base64, mimeType });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Chama o backend (Apps Script) — a chave da Gemini nunca passa por aqui
        async function extrairViaBackend(payload) {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS no Apps Script
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data;
        }

        async function processFiles() {
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const outputSection = document.getElementById('outputSection');
            const outputBox = document.getElementById('outputBox');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            loading.classList.add('show');

            try {
                let allResults = '';

                for (let i = 0; i < selectedFiles.length; i++) {
                    const entry = selectedFiles[i];
                    const file = entry.file;
                    const customName = (entry.customName || '').trim();
                    const { base64, mimeType } = await fileToBase64(file);

                    const totalFiles = selectedFiles.length;
                    const progressPercent = Math.round((i / totalFiles) * 100);
                    document.getElementById('progressFill').style.width = progressPercent + '%';
                    document.getElementById('progressPercent').textContent = progressPercent + '%';
                    document.getElementById('loadingStatus').textContent = `Processando e salvando ${i + 1} de ${totalFiles}...`;

                    const data = await extrairViaBackend({
                        fileBase64: base64,
                        mimeType,
                        format: selectedFormat,
                        fileName: file.name,
                        customName,
                        secret: SHARED_SECRET
                    });

                    allResults += data.resultLine + '\n';

                    const finalPercent = Math.round(((i + 1) / totalFiles) * 100);
                    document.getElementById('progressFill').style.width = finalPercent + '%';
                    document.getElementById('progressPercent').textContent = finalPercent + '%';

                    // Intervalo entre requisições pra reduzir chance de esbarrar no limite da Gemini
                    if (i < selectedFiles.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                }

                loading.classList.remove('show');
                outputBox.value = allResults.trim();
                outputSection.classList.add('show');
                successMessage.textContent = '✅ Salvo direto na planilha com sucesso!';
                successMessage.classList.add('show');
                selectedFiles = [];
                updateFileList();

            } catch (error) {
                loading.classList.remove('show');
                errorMessage.textContent = `❌ Erro: ${error.message}`;
                errorMessage.classList.add('show');
            }
        }

        processBtn.addEventListener('click', processFiles);

        // Copiar resultado
        const copyBtn = document.getElementById('copyBtn');
        const outputBox = document.getElementById('outputBox');

        function fallbackCopy(text) {
            outputBox.focus();
            outputBox.select();
            try { document.execCommand('copy'); } catch (e) {}
        }

        copyBtn.addEventListener('click', () => {
            const text = outputBox.value;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        });

        // Registra o service worker (instalabilidade do PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.error('SW falhou:', err));
            });
        }
    </script>
</body>
</html>
