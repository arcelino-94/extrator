name: Aviso diário de contas

on:
  schedule:
    - cron: '47 11 * * 1-5'  # 11:47 UTC = 08:47 em Recife (minuto quebrado evita o horário de pico do GitHub)
  workflow_dispatch:           # botão "Run workflow" para testar

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push --no-save
      - run: node scripts/enviar-aviso.js
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
